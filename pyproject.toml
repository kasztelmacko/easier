[project]
name = "easier"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo",
    "pandas",
    "plotly",
    "rich-pyfiglet>=2.0.1",
    "typer>=0.27.0",
]

[project.scripts]
easier = "easier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easier"]
