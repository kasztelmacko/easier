[project]
name = "easier"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "marimo",
    "pandas",
    "plotly",
]

[project.scripts]
easier = "easier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easier"]

[tool.hatch.build.targets.wheel.force-include]
"src/easier/skills" = "easier/skills"